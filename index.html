<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário Completo</h1>
    <form action="/submit" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label> Nome: <input type="text" required> </label>
            <p><label> Sobrenome: <input type="text" required> </label></p>
            <p><label> Email: <input type="email" required> </label></p>
            <p><label> Telefone: <input type="text" required> </label></p>
            <p><label> Data de Nascimento : <input type="date" required> </label></p >
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>
            <label> Rua: <input type="text" required> </label>
            <p><label> Número: <input type="text" required> </label></p>
            <p><label> Cidade: <input type="text" required> </label></p>
            <p><label> Estado: <input type="text" required> </label></p >
            <p><label> CEP: <input type="text" required> </label></p >
        </fieldset>

        <fieldset>
            <legend>Preferências</legend>
                Cor Favorita: 
                <select name="cor_favorita" required>
                <option value="vermelho">Vermelho</option>
                <option value="azul">Azul</option>
                <option value="verde">Verde</option></p><br>
                </Select>

                <p>Gênero: 
                <input type="radio" name="genero" value="m" required> 
                Masculino
                <input type="radio" name="genero" value="f" required> 
                Feminino </p>

                <p>Interesses:<br>
                <input type="checkbox" value="esportes" required> 
                <label>Esportes</label><br>
                <input type="checkbox"  value="música" required> 
                <label></label>Música</label><br>
                <input type="checkbox"  value="Tecnologia" required> 
                <label>Tecnologia</label>
                </p>
        </fieldset>

        <fieldset>
            <legend>Upload de Arquivo</legend>
            <label> Escolha um arquivo: <input type="file" required> </p>
            </label>
        </fieldset>

        <fieldset>
            <legend>Informações de Login</legend>
            <label>Nome de Usuário: <input type="text" required> </label>
            <p><label>Senha: <input type="password" required> </label></p>
            <p><label>Confirmar Senha: <input type="password" required> </label></p>

            </fieldset>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
